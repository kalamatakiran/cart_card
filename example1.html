<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Muli">
    <style>
        
        .root{
            width:100%;
            height:100vh;
            background-color: green;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: muli;
        }
        .sec1{
            width:600px;
            height:550px;
            background-color: white;
            display: flex;
            border-radius: 10px;
        }
        .left{
            width:45%;
            height:100%;
            display: flex;
            align-items: center;
            justify-content: center;
            
        }
        .left1{
            width: 240px;
            height: 380px;
            background-color: greenyellow;
            position: relative;
            left:-40px;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.16) 0px 10px 36px 0px, rgba(0, 0, 0, 0.06) 0px 0px 0px 1px;
        }
        .left1 img{
            width: 300px;
            position: absolute;
            left:-45px;
            top:50px;
        }
        .right{
            width:55%;
            padding:10px;
        }
        .header{
            margin-top: 50px;

        }
        .deli{
            font-size:27px;
            font-weight: 600;
            
        }
        .cod{
            display: block;
            margin-top: 10px;
            color: #434141;
        }
        .rate{
            margin-top: 25px;
            color: red;
        
        }
        .money{
            font-size: 40px;
            margin-left: 5px;
        }
        .color{
            margin-top: 15px;
            color: rgb(119, 116, 116);
            font-weight: 500;
            letter-spacing: 0.4px;
            display: flex;
            flex-direction: column;
           
        }
        .images{
            align-self: center;
        }
        .images img{
            margin-top: 10px;
            border: 2px solid black;
            width: 30px;
        }
        .ben{
            margin-top: 15px;
        }
        .ben span{
            color: rgb(119, 116, 116);
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .footer{
            width:120px;
            padding: 15px;
            text-align: center;
            color: white;
            font-weight: 600;
            border-radius: 5px;
            box-shadow: rgba(17, 17, 26, 0.1) 0px 4px 16px, rgba(17, 17, 26, 0.1) 0px 8px 24px, rgba(17, 17, 26, 0.1) 0px 16px 56px;
            background-color: rgb(245, 80, 30);
            font-size: 10px;
            letter-spacing: 1px;
            margin-top: 25px;
        }
        


    </style>
</head>
<body>
    <div class="root">
        <div class="sec1">
            <div class="left">
                <div class="left1">
                    <img src="green-apple-with-slice.png" alt="">
                </div>
            </div>
            <div class="right">
                <div class="header">
                    <span class="deli">Delicious Apples</span><br>
                    <span class="cod">COD 45999</span>
                </div>
                <div class="rate">
                    <span>R$</span>
                    <span class="money">7.93</span>
                </div>
                <div class="color">
                    <span>SELECT A COLOR</span>
                    <div class="images">
                    <img  src="green-apple2.png" alt="" >
                    <img src="orange-apple.png" alt="">
                    <img src="red-apple.png" alt="">
                    <img src="yellow-apple.png" alt="">
                    </div>
                </div>
                <div class="ben">
                    <span>BENEFITS</span>
                    <ul>
                        <li>apples are nutricious</li>
                        <li>apples are good for weight loss</li>
                        <li>apples may be good for bone health</li>
                        <li>They are linked to a lowest risk of diabetes</li>
                    </ul>
                </div>
                <div class="footer">
                    <span>ADD TO CART</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
